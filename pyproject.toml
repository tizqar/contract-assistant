[project]
name = "contract-assistant"
version = "0.1.0"
description = "Local contract assistant: extract once with a fine-tuned CUAD encoder, answer many questions with verified verbatim citations."
requires-python = ">=3.12"
dependencies = [
  "torch>=2.4",
  "transformers>=5.13,<5.16",   # 5.16+ silently breaks sliding-window tokenisation (see extract/windowing.py)
  "tokenizers<0.23",
  "numpy>=1.26",
  "pydantic>=2.7",
  "pdfplumber>=0.11",
  "sentence-transformers>=3.0",
  "ollama>=0.5",
  "httpx>=0.27",
  "gradio>=6.29,<7",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pytesseract>=0.3",
  "python-dotenv>=1.0",
  "python-docx>=1.1",
  "sqlalchemy>=2.0.36,<2.1",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "fpdf2>=2.7"]
api = ["openai>=1.40"]

[project.scripts]
contract-assistant = "contract_assistant.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["contract_assistant*"]

[tool.setuptools.package-data]
contract_assistant = [
  "web/templates/**/*.html",
  "web/static/*",
  "db/migrations/*.py",
  "db/migrations/*.mako",
  "db/migrations/versions/*.py",
]

[tool.ruff]
line-length = 96

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: downloads a model and runs inference; run explicitly",
  "pg: needs the Postgres of docker-compose (make db-up); skipped when it is not reachable",
]
