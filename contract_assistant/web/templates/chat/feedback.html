{# The thumbs under an answer; the feedback route swaps them for its thanks. #}
<span class="feedback" id="feedback-{{ index }}">
  <button type="button" title="Helpful" hx-post="/documents/{{ cache.doc_id }}/feedback" hx-vals='{"index": "{{ index }}", "liked": "1"}' hx-target="#feedback-{{ index }}" hx-swap="outerHTML">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10v12"></path><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"></path></svg>
    <span class="sr-only">Helpful</span>
  </button>
  <button type="button" title="Not helpful" hx-post="/documents/{{ cache.doc_id }}/feedback" hx-vals='{"index": "{{ index }}", "liked": "0"}' hx-target="#feedback-{{ index }}" hx-swap="outerHTML">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 14V2"></path><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"></path></svg>
    <span class="sr-only">Not helpful</span>
  </button>
</span>
