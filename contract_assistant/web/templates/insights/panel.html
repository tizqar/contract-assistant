{# The insights panel: the tab bar, the body each tab loads into, and the composer. #}
<div class="tabs" role="tablist" aria-label="Insights">
  <button type="button" class="tab tab-active" role="tab" data-tab="chat"
          hx-get="/documents/{{ cache.doc_id }}/chat" hx-target="#insight-body" hx-swap="innerHTML" hx-trigger="click, load">Chat</button>
  <button type="button" class="tab" role="tab" data-tab="summary"
          hx-get="/documents/{{ cache.doc_id }}/summary" hx-target="#insight-body" hx-swap="innerHTML">Summary</button>
  <button type="button" class="tab" role="tab" data-tab="terms"
          hx-get="/documents/{{ cache.doc_id }}/terms" hx-target="#insight-body" hx-swap="innerHTML">Key terms</button>
  <button type="button" class="tab" role="tab" data-tab="review"
          hx-get="/documents/{{ cache.doc_id }}/review" hx-target="#insight-body" hx-swap="innerHTML">Review</button>
  <button type="button" class="tab" role="tab" data-tab="obligations"
          hx-get="/documents/{{ cache.doc_id }}/obligations" hx-target="#insight-body" hx-swap="innerHTML">Obligations</button>
  <button type="button" class="tab" role="tab" data-tab="checklist"
          hx-get="/documents/{{ cache.doc_id }}/checklist" hx-target="#insight-body" hx-swap="innerHTML">Clauses</button>
  <button type="button" class="tab" role="tab" data-tab="definitions"
          hx-get="/documents/{{ cache.doc_id }}/definitions" hx-target="#insight-body" hx-swap="innerHTML">Definitions</button>
</div>
<div id="insight-body" class="insight-body" role="tabpanel"></div>
<footer class="composer">
  <div class="chips" aria-label="Suggested questions">
    {% for text in suggestions %}
    <button type="button" class="chip" data-fill="{{ text }}">{{ text }}</button>
    {% endfor %}
  </div>
  <form class="ask" data-stream data-target="#insight-body" data-activate="chat" data-reset
        action="/documents/{{ cache.doc_id }}/ask" method="post">
    <label class="sr-only" for="question">Ask about this contract</label>
    <input id="question" name="question" class="input" autocomplete="off"
           placeholder="Ask about this contract, or say 'explain that' or 'summarize'">
    <button class="btn btn-primary" type="submit">Ask</button>
    <button class="btn btn-stop" type="button" data-stop hidden>Stop</button>
  </form>
</footer>
