{# The sample contracts not read yet. Each is read the same way as an upload, then opened. #}
{% if samples %}
<section class="samples{% if wide is defined and wide %} samples-wide{% endif %}" aria-labelledby="samples-title">
  <h2 class="samples-title" id="samples-title">{{ copy.SAMPLES }}</h2>
  <div class="sample-list">
    {% for s in samples %}
    <form class="sample" data-stream data-target="#sample-status" action="/samples/{{ s.name }}" method="post">
      <button type="submit" class="sample-btn"{% if not can_read %} disabled title="{{ samples_need_model }}"{% endif %}>
        <span class="sample-name">{{ s.title }}</span>
        <span class="sample-meta">{{ s.kind }} · {{ s.size }}</span>
      </button>
      <button class="btn btn-stop btn-sm" type="button" data-stop hidden>Stop</button>
    </form>
    {% endfor %}
  </div>
  {% if not can_read %}<p class="meta">{{ samples_need_model }}</p>{% endif %}
  <div id="sample-status" class="upload-status" aria-live="polite"></div>
</section>
{% endif %}
