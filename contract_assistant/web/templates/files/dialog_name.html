{# The dialog that names a new folder (mode "new"), or renames a folder or a contract. A refused name comes back as a toast and the dialog stays open. #}
<form class="files-form" hx-post="{{ action }}" hx-swap="none">
  {% if mode == "new" %}
  <h2 class="files-dialog-title" id="files-dialog-title">{{ _("New folder") }}</h2>
  <input type="hidden" name="parent" value="{{ parent }}">
  <input type="hidden" name="owner" value="{{ owner }}">
  {% else %}
  <h2 class="files-dialog-title" id="files-dialog-title">{{ _("Rename {name}").format(name=label) }}</h2>
  {% endif %}
  <label class="files-field">
    <span>{{ _("Folder name") if mode == "new" else _("New name") }}</span>
    <input class="input" name="name" value="{{ value }}" maxlength="255" required autocomplete="off" autofocus>
  </label>
  <div class="files-dialog-actions">
    <button type="button" class="btn" data-dialog-close>{{ _("Cancel") }}</button>
    <button type="submit" class="btn btn-primary">{{ _("Create the folder") if mode == "new" else _("Rename") }}</button>
  </div>
</form>
